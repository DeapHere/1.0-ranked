# Fly.io config. Change "app" to a unique name before your first deploy (see README).
app = "ranked-1-0"
primary_region = "syd"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "ranked_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # matches live in memory, so the server must never be stopped while idle
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
